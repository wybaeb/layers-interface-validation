<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка структуры · Pulse-Interface-Study</title><style>
*{box-sizing:border-box}:root{--bg:#1e2027;--panel:#292d36;--ink:#f3f4f7;--muted:#b5bcc8;--accent:#ff5533;--line:#596171}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:36px 20px 70px}h1{font-size:36px;line-height:1.1}section{background:var(--panel);padding:24px;border-radius:14px;margin:18px 0}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#181a20;color:var(--ink);font:inherit}button{font:inherit;color:var(--ink);border:1px solid #707a8e;background:transparent;border-radius:9px;padding:11px 14px;cursor:pointer}button.primary{background:var(--accent);color:#1e2027;border-color:var(--accent);font-weight:800}.choices{display:grid;gap:10px;margin:18px 0}.choices button{text-align:left}.crumbs{display:flex;gap:7px;flex-wrap:wrap}.crumbs button{padding:5px 8px;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}.progress{color:var(--accent);font-weight:800}.done{border-left:4px solid #91c6aa}@media(max-width:600px){main{padding:24px 12px}h1{font-size:30px}section{padding:18px}}
</style></head><body><main><p class="progress">LAYERS · TREE TESTING</p><h1>Pulse-Interface-Study</h1><p>Выполняйте задания по одному. Вы увидите только названия разделов, без экранов интерфейса.</p>
<section id="start"><label for="participant">Код участника без имени и контактов</label><input id="participant" value="R1"><p class="muted">Например, R1. Код нужен только для разделения сессий.</p><button class="primary" id="begin">Начать</button></section>
<section id="task" class="hidden"><p class="progress" id="counter"></p><h2 id="prompt"></h2><div class="crumbs" id="crumbs"></div><div class="choices" id="choices"></div><div class="actions"><button id="choose">Выбрать текущий раздел</button><button id="back">Назад</button></div></section>
<section id="done" class="hidden done"><h2>Сессия завершена</h2><p>Скачайте результат и передайте файл исследователю.</p><div class="actions"><button class="primary" id="download">Скачать результат</button><button id="again">Новый участник</button></div></section>
<script>const STUDY={"schemaVersion": 1, "id": "pulse-interface-study", "title": "Pulse-Interface-Study", "tree": {"id": "root", "label": "Пульс", "children": [{"id": "пульс-главная", "label": "Главная", "children": []}, {"id": "пульс-рабочий-день", "label": "Рабочий день", "children": [{"id": "пульс-рабочий-день-расписание", "label": "Расписание", "children": []}, {"id": "пульс-рабочий-день-смены", "label": "Смены", "children": []}]}, {"id": "пульс-команда", "label": "Команда", "children": [{"id": "пульс-команда-сотрудники", "label": "Сотрудники", "children": []}, {"id": "пульс-команда-приглашения", "label": "Приглашения", "children": []}]}, {"id": "пульс-профиль", "label": "Профиль", "children": []}]}, "tasks": [{"id": "T-01", "prompt": "Вы хотите узнать, кто работает завтра утром. Где будете искать?", "targetId": "пульс-рабочий-день-расписание"}, {"id": "T-02", "prompt": "Нужно пригласить нового сотрудника. Где начнёте?", "targetId": "пульс-команда-приглашения"}]};let participant='',index=0,current=STUDY.tree,path=[],started=0,backtracks=0,firstChoice=null,results=[];const $=id=>document.getElementById(id);function render(){const task=STUDY.tasks[index];$('counter').textContent='Задание '+(index+1)+' из '+STUDY.tasks.length;$('prompt').textContent=task.prompt;$('crumbs').innerHTML='';path.forEach((node,i)=>{const b=document.createElement('button');b.textContent=node.label;b.onclick=()=>{if(i<path.length-1)backtracks+=1;path=path.slice(0,i+1);current=path.at(-1);render()};$('crumbs').appendChild(b)});$('choices').innerHTML='';current.children.forEach(child=>{const b=document.createElement('button');b.textContent=child.label;b.onclick=()=>{if(!firstChoice)firstChoice=child.label;current=child;path.push(child);render()};$('choices').appendChild(b)});$('choose').disabled=current.id==='root'}function resetTask(){current=STUDY.tree;path=[STUDY.tree];started=Date.now();backtracks=0;firstChoice=null}function next(){const task=STUDY.tasks[index];results.push({taskId:task.id,targetId:task.targetId,selectedId:current.id,success:current.id===task.targetId,backtracks,firstChoiceLabel:firstChoice,pathLabels:path.map(n=>n.label),durationSeconds:Math.max(1,Math.round((Date.now()-started)/1000))});index+=1;if(index>=STUDY.tasks.length){$('task').classList.add('hidden');$('done').classList.remove('hidden');return}resetTask();render()}$('begin').onclick=()=>{participant=$('participant').value.trim()||'R';index=0;results=[];resetTask();$('start').classList.add('hidden');$('task').classList.remove('hidden');render()};$('choose').onclick=next;$('back').onclick=()=>{if(path.length>1){path.pop();current=path.at(-1);backtracks+=1;render()}};$('download').onclick=()=>{const payload={schemaVersion:1,studyId:STUDY.id,participantId:participant,completedAt:new Date().toISOString(),results},blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tree-result-'+participant+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('again').onclick=()=>{$('done').classList.add('hidden');$('start').classList.remove('hidden')};</script></main></body></html>
